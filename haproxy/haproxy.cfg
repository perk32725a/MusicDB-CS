# HAProxy in front of the MusicDB app copies (compose.yaml 'haproxy' service).
#   site:  http://localhost:8080      stats: http://localhost:8404
# The same ideas carry over to Kubernetes: Docker DNS -> a Service,
# health checks -> readiness probes, server-template -> Deployment replicas.

global
    log stdout format raw local0

defaults
    mode http
    log global
    option httplog
    option redispatch          # if a copy fails mid-request, retry on another
    retries 3
    timeout connect 5s
    timeout client  30s
    timeout server  60s        # Refresh of a large library can take a few seconds

# Docker's internal DNS: 'app' resolves to every running app container
resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    hold valid 5s              # re-check often, so scaling up/down is noticed quickly

frontend web
    bind :8080
    # tell the app the client's IP and original scheme (the app trusts these
    # only because ReverseProxy__Enabled=true is set for it)
    option forwardfor
    http-request set-header X-Forwarded-Proto http
    # show which copy answered (for demos and testing)
    http-response set-header X-Served-By %[srv_name]
    default_backend app

backend app
    # round robin, deliberately WITHOUT sticky sessions: any request can go to
    # any copy, which is what proves the shared Data Protection keys work
    balance roundrobin
    option httpchk GET /healthz/ready
    http-check expect status 200
    # check every 2s; 2 failures = DOWN, 2 successes = UP
    default-server check inter 2s fall 2 rise 2
    # up to 4 copies, found through DNS; unused slots show as MAINT on the stats page
    server-template app 4 app:8080 resolvers docker init-addr none

frontend stats
    bind :8404
    stats enable
    stats uri /
    stats refresh 5s
