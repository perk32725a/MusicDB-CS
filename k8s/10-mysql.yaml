# MySQL 8.4 for the music database: compose's 'mysql' service and its
# 'musicdb-data' volume, as a Kubernetes StatefulSet.
#
# A StatefulSet (not a Deployment) because a database needs a stable identity
# and its own volume that follows it: the pod is always 'mysql-0' and always
# gets the same PersistentVolumeClaim back.
#
# Storage: a Ceph RBD block device (StorageClass 'ceph-rbd', from the lab
# repo homelab-kvm-ceph-k8s). Its data is replicated across all three nodes,
# so mysql-0 can run on any node and take its data with it. (Until
# 2026-11-15 it used k3s's 'local-path', a folder on one node, which pinned
# MySQL to that node.) The class's reclaimPolicy is Retain: deleting the
# claim keeps the RBD image in Ceph until it is removed by hand.
#
# Even so, if MySQL's node goes down unexpectedly, Kubernetes deliberately
# won't start mysql-0 elsewhere on its own: the node might still be running
# and writing. Once the node is confirmed down, mark it out of service:
#   kubectl taint node <node> node.kubernetes.io/out-of-service=nodeshutdown:NoExecute
# and remove the taint when the node is back.
---
# Headless Service: gives the pod a stable DNS name ('mysql', or
# 'mysql-0.mysql') inside the namespace. The app connects to 'mysql:3306'.
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: musicdb
  labels: {app: mysql}
spec:
  clusterIP: None
  selector: {app: mysql}
  ports:
    - name: mysql
      port: 3306
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: musicdb
spec:
  serviceName: mysql
  replicas: 1
  selector:
    matchLabels: {app: mysql}
  template:
    metadata:
      labels: {app: mysql}
    spec:
      # Run as the image's 'mysql' user (uid/gid 999) from the start, not as
      # root: the database never runs as root, and the image's entrypoint
      # skips its root-to-mysql switch ('gosu'). fsGroup makes the data
      # volume writable by that group.
      #
      # (Found 2026-11-15: MySQL first hung in gosu, then in its setup step.
      # The real cause was AppArmor, not gosu: on Ubuntu 26.04 with kernel
      # 7.0.0-42+ and kernel.apparmor_restrict_unprivileged_unconfined=1,
      # containers get the stacked label 'cri-containerd.apparmor.d//&unconfined'
      # and containerd's default profile then denies signals between a
      # container's own processes and threads (containerd issue #14485).
      # Fixed on the nodes by setting that sysctl to 0; see lab-plan.md.)
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
        - name: mysql
          image: mysql:8.4                    # current MySQL LTS; has an ARM64 image
          ports:
            - name: mysql
              containerPort: 3306
          env:
            - {name: MYSQL_DATABASE, value: MusicDB}
            - {name: MYSQL_USER, value: musicdb}
            - name: MYSQL_PASSWORD
              valueFrom: {secretKeyRef: {name: musicdb-db, key: MYSQL_PASSWORD}}
            - name: MYSQL_ROOT_PASSWORD
              valueFrom: {secretKeyRef: {name: musicdb-db, key: MYSQL_ROOT_PASSWORD}}
          # Requests are what the scheduler reserves on a node; limits are the
          # most the container may use (over the memory limit it is restarted).
          resources:
            requests: {cpu: 100m, memory: 512Mi}
            limits: {memory: 1Gi}
          # Health checks all run 'mysqladmin ping' over TCP. The password goes
          # in via MYSQL_PWD rather than -p, so mysqladmin doesn't warn about
          # a password on the command line.
          # 'started' = first answer. Allows up to 5 minutes (30 x 10 s) for
          # the first-time setup; the other two checks wait until this passes.
          startupProbe:
            exec:
              command: ["sh", "-c", "MYSQL_PWD=\"$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h 127.0.0.1 -u root --silent"]
            periodSeconds: 10
            failureThreshold: 30
          # 'ready' = MySQL answers; until then no traffic is sent to it.
          readinessProbe:
            exec:
              command: ["sh", "-c", "MYSQL_PWD=\"$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h 127.0.0.1 -u root --silent"]
            periodSeconds: 5
          # 'alive' = still responding; restarted after 3 misses in a row.
          livenessProbe:
            exec:
              command: ["sh", "-c", "MYSQL_PWD=\"$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h 127.0.0.1 -u root --silent"]
            periodSeconds: 20
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
  # One PersistentVolumeClaim per pod ('data-mysql-0'), kept even if the
  # StatefulSet is deleted, so the data survives redeploys.
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        storageClassName: ceph-rbd          # Ceph block device (replicated x3)
        accessModes: [ReadWriteOnce]        # one node at a time, as a database needs
        resources:
          requests: {storage: 5Gi}
