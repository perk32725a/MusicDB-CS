# Everything for the music database lives in its own namespace, apart from
# k3s's own objects (kube-system). Delete it all with: kubectl delete namespace musicdb
#
# Before 'kubectl apply -f k8s/', create the Secret the other files use
# (passwords never go in these files or in git):
#
#   P=$(openssl rand -hex 16); R=$(openssl rand -hex 16)
#   kubectl create namespace musicdb
#   kubectl -n musicdb create secret generic musicdb-db \
#     --from-literal=MYSQL_PASSWORD="$P" \
#     --from-literal=MYSQL_ROOT_PASSWORD="$R" \
#     --from-literal=ConnectionStrings__DefaultConnection="server=mysql;port=3306;database=MusicDB;user=musicdb;password=$P"
#   unset P R
apiVersion: v1
kind: Namespace
metadata:
  name: musicdb
