# Redis 8 for the music database: compose's 'redis' service.
# A cache only, so a Deployment (pods are interchangeable) with no volume:
# no saving to disk, memory capped, and when full it evicts only keys that
# have an expiry (cached pages), never the cache-version key.
# Note: the app also keeps its shared Data Protection keys here; a Redis
# restart drops them, so open forms must be reloaded once (as in compose).
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: musicdb
  labels: {app: redis}
spec:
  selector: {app: redis}
  ports:
    - name: redis
      port: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: musicdb
spec:
  replicas: 1
  selector:
    matchLabels: {app: redis}
  template:
    metadata:
      labels: {app: redis}
    spec:
      containers:
        - name: redis
          image: redis:8
          args: ["redis-server", "--save", "", "--appendonly", "no",
                 "--maxmemory", "128mb", "--maxmemory-policy", "volatile-lru"]
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}           # 128 MB of data plus Redis's own overhead
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 20
